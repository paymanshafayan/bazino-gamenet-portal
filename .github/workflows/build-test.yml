name: Backend & Frontend Build + Tests

# این ورک‌فلو روی هر push و pull-request به main اجرا می‌شود:
#  ۱) تایپ‌چک (TypeScript) — کل پروژه
#  ۲) تست‌های موتور قالب و ذخیره‌ساز قالب (اسکریپت‌های verify)
#  ۳) بیلد فرانت‌اند (Vite build) + تست بوت سرور بک‌اند (API راست‌آزمایی)
#  ۴) بیلد کامل بک‌اند (esbuild → dist/server.cjs)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # ۱) تایپ‌چک + تست‌های منطقی (سریع — بدون بیلد)
  # ─────────────────────────────────────────────────────────────────
  typecheck-and-tests:
    name: Typecheck & Theme tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Theme engine tests
        run: npx tsx scripts/verify-themes.ts

      - name: Theme store tests
        run: npx tsx scripts/test-theme-store.mts

  # ─────────────────────────────────────────────────────────────────
  # ۲) بیلد فرانت‌اند (Vite) + بوت سرور بک‌اند و راست‌آزمایی API
  # ─────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (vite build)
        run: npx vite build

      - name: Verify dist output
        run: |
          test -f dist/index.html
          test -f dist/assets/index-*.css
          echo "dist/ contains:"
          ls -la dist/ | head -20

  # ─────────────────────────────────────────────────────────────────
  # ۳) بیلد بک‌اند (esbuild) + بوت سرور + راست‌آزمایی API های اصلی
  # ─────────────────────────────────────────────────────────────────
  backend-build:
    name: Backend build & boot test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # بهتر-sqlite3 یک ماژول native است؛ در CI باید کامپایل شود
      - name: Build native module (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build backend bundle (esbuild → dist/server.cjs)
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      # استاتیک‌های عمومی (لوگو و ...) را برای بوت production در dist قرار بده
      - name: Copy public assets into dist
        run: |
          mkdir -p dist
          cp -r public/. dist/

      - name: Boot server & smoke-test APIs
        env:
          JWT_SECRET: ci-smoke-test-only-not-a-real-secret
        run: |
          set -euo pipefail
          # بوت سرور در پس‌زمینه
          NODE_ENV=production PORT=3456 node dist/server.cjs > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # منتظر بالا آمدن سرور (حداکثر ۲۰ ثانیه)
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:3456/; then
              echo "Server is up (attempt $i)"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died! Log:"
              cat server.log
              exit 1
            fi
            sleep 1
          done

          echo "── API smoke tests ──"
          curl -sf http://127.0.0.1:3456/api/systems | head -c 200; echo
          curl -sf http://127.0.0.1:3456/api/cafe | head -c 100; echo
          curl -sf http://127.0.0.1:3456/api/tournaments | head -c 100; echo
          curl -sf http://127.0.0.1:3456/api/articles | head -c 100; echo
          curl -sf http://127.0.0.1:3456/api/coupons | head -c 100; echo
          curl -sf http://127.0.0.1:3456/api/data-source | head -c 200; echo

          echo "── Theme endpoints ──"
          curl -sf http://127.0.0.1:3456/api/themes | head -c 200; echo
          curl -sf -o /dev/null -w "logo.png: %{http_code}\n" http://127.0.0.1:3456/logo.png

          # خاموش کردن سرور
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          echo "✅ Backend boot & smoke tests passed"

      - name: Dump server log on failure
        if: failure()
        run: cat server.log || true
