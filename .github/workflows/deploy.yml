name: Deploy to Railway & Purge CDN Cache

# این ورک‌فلو با هر push روی برنچ main (یا اجرای دستی از تب Actions) این کارها را می‌کند:
#  ۱) npm ci + npm run build → تأیید سالم بودن بیلد (Railway خودش هم دقیقاً همین مراحل را
#     در زمان دپلو اجرا می‌کند: npm ci ← npm run build ← npm start)
#  ۲) دپلو به Railway با CLI و Project Token (جایگزین Git Pull و ری‌استارت دستی)
#  ۳) پاکسازی کش CDN بعد از دپلو — کلادفلر و/یا ابرآروان؛ هرکدام که سکرت‌هایش در ریپو
#     تنظیم شده باشد اجرا می‌شود و بقیه به‌صورت خودکار رد می‌شوند.
#
# ⚠️ نکته مهم — جلوگیری از دپلوی دوباره:
#    اگر در داشبورد Railway قابلیت Auto-Deploy از گیت‌هاب برای این ریپو فعال است،
#    یا آن را در Railway خاموش کنید (و دپلو را به همین ورک‌فلو بسپارید)، یا مرحله‌ی
#    «Deploy to Railway» را از این فایل حذف کنید تا فقط پاکسازی کش انجام شود.
#
# سکرت‌های لازم (Settings → Secrets and variables → Actions در گیت‌هاب):
#   RAILWAY_TOKEN         → Project Token از Railway (Project → Settings → Tokens)
#   RAILWAY_SERVICE_NAME  → (اختیاری) نام سرویس، اگر پروژه‌ی Railway چند سرویس دارد
#   CLOUDFLARE_API_TOKEN  → توکن با دسترسی Cache Purge (My Profile → API Tokens)
#   CLOUDFLARE_ZONE_ID    → Zone ID دامنه (در صفحه‌ی Overview سایت در کلادفلر)
#   ARVANCLOUD_API_KEY    → کلید API از پنل کاربری ابرآروان
#   ARVANCLOUD_DOMAIN     → دامنه‌ی ثبت‌شده در ابرآروان (مثل example.com)

on:
  push:
    branches:
      - main
  workflow_dispatch: # اجرای دستی — مثلاً فقط برای پاکسازی کش بدون تغییر کد

concurrency:
  group: railway-deploy-main
  # دپلوی در حال اجرا نباید نصفه قطع شود؛ push های بعدی صبر می‌کنند
  cancel-in-progress: false

jobs:
  deploy-and-purge:
    name: Deploy & Purge CDN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # با ورک‌فلو build-test.yml هماهنگ است (ریل‌پک Railway پروژه را با همین نسخه بیلد می‌کند)
          node-version: '22'
          cache: npm

      # ─── ۱) تأیید بیلد ───────────────────────────────────────────────────
      # همان چیزی که Railway اجرا می‌کند؛ اگر اینجا قرمز شود، دپلو انجام نمی‌شود
      # و نسخه‌ی سالم قبلی روی سرور می‌ماند.
      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build project (Vite + Management App + server bundle)
        # npm run build = vite build → بیلد اپ مدیریت → باندل server.ts با esbuild به dist/server.cjs
        run: npm run build

      # ─── ۲) دپلو به Railway ──────────────────────────────────────────────
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::warning::سکرت RAILWAY_TOKEN تنظیم نشده؛ مرحله‌ی دپلو رد شد."
            echo "اگر Auto-Deploy خود Railway متصل به گیت‌هاب فعال است، این طبیعی است."
            exit 0
          fi
          # ⚠️ نسخه‌ی CLI پین شده است: در v5.3.0 باگ رگرسیونی وجود داشت که railway up
          # با Project Token در CI خطای "Not signed in" می‌داد. قبل از ارتقا به نسخه‌ی
          # جدیدتر، رفع شدن این باگ را در ریلیزنوت‌های CLI بررسی کنید.
          npm i -g @railway/cli@5.2.0
          # --detach: آپلود سورس و شروع بیلد راه‌آن، بدون انتظار برای اتمام دپلو
          # (بیلد نهایی روی Railway انجام می‌شود؛ پوشه‌ی dist به‌لطف .gitignore آپلود نمی‌شود)
          CMD=(railway up --detach)
          if [ -n "${RAILWAY_SERVICE_NAME:-}" ]; then
            CMD+=(--service "$RAILWAY_SERVICE_NAME")
          fi
          "${CMD[@]}"

      # ─── ۳) پاکسازی کش کلادفلر ───────────────────────────────────────────
      - name: Purge Cloudflare Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "سکرت‌های کلادفلر تنظیم نشده‌اند؛ این مرحله رد شد."
            exit 0
          fi
          # توجه: آدرس صحیح API کلادفلر api.cloudflare.com است
          # (آدرسی مثل https://cloudflare.com{ZONE_ID}/purge_cache کار نمی‌کند)
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          echo "$RESPONSE" | head -n -1
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::پاکسازی کش کلادفلر ناموفق بود (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "✅ کش کلادفلر به‌طور کامل پاک شد."

      # ─── ۳-جایگزین) پاکسازی کش ابرآروان ──────────────────────────────────
      - name: Purge ArvanCloud Cache
        env:
          ARVANCLOUD_API_KEY: ${{ secrets.ARVANCLOUD_API_KEY }}
          ARVANCLOUD_DOMAIN: ${{ secrets.ARVANCLOUD_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "${ARVANCLOUD_API_KEY:-}" ] || [ -z "${ARVANCLOUD_DOMAIN:-}" ]; then
            echo "سکرت‌های ابرآروان تنظیم نشده‌اند؛ این مرحله رد شد."
            exit 0
          fi
          # ⚠️ رانرهای گیت‌هاب خارج از ایران‌اند؛ اگر به napi.arvancloud.ir دسترسی نداشتند،
          # این مرحله را حذف کنید و پاکسازی را با Railway Webhook از داخل سرور انجام دهید.
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://napi.arvancloud.ir/cdn/4.0/domains/${ARVANCLOUD_DOMAIN}/caching/purge" \
            -H "Authorization: Apikey ${ARVANCLOUD_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"purge":"all"}')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          echo "$RESPONSE" | head -n -1
          if [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::پاکسازی کش ابرآروان ناموفق بود (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "✅ کش ابرآروان به‌طور کامل پاک شد."
