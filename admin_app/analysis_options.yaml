include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # فرم‌های ادمین پر از await+context هستند؛ گاردهای mounted کجا لازم بود
    # نوشته شده‌اند ولی خودِ lint روی الگوهای بی‌خطر هم شلوغ می‌کند.
    use_build_context_synchronously: ignore

linter:
  rules:
    prefer_single_quotes: true
