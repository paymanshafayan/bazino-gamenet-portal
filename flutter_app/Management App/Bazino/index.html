<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS / iPhone 14 Pro Mobile Web App & Theme Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BAZINO PRO" />
    <meta name="theme-color" content="#09090b" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>BAZINO PRO | نرم‌افزار جامع مدیریت گیم‌نت</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Legacy Browser & iOS WebKit Compatibility Polyfills -->
    <script>
      (function() {
        // Global polyfill
        if (typeof window !== 'undefined') {
          if (typeof window.global === 'undefined') window.global = window;
          if (typeof window.globalThis === 'undefined') window.globalThis = window;
        }
        // Object.hasOwn polyfill for older iOS / Android WebKit
        if (!Object.hasOwn) {
          Object.hasOwn = function(obj, prop) {
            return Object.prototype.hasOwnProperty.call(obj, prop);
          };
        }
        // Array.prototype.at polyfill
        if (!Array.prototype.at) {
          Array.prototype.at = function(n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            if (n < 0 || n >= this.length) return undefined;
            return this[n];
          };
        }
        // structuredClone fallback
        if (typeof window !== 'undefined' && !window.structuredClone) {
          window.structuredClone = function(obj) {
            return JSON.parse(JSON.stringify(obj));
          };
        }
      })();
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-['Vazirmatn',sans-serif] antialiased selection:bg-amber-500 selection:text-black min-h-screen min-h-[100dvh]">
    <div id="root"></div>
    
    <!-- Fallback error handler for outdated browser engines -->
    <script>
      window.addEventListener('error', function(e) {
        var rootDiv = document.getElementById('root');
        if (rootDiv && rootDiv.children.length === 0) {
          rootDiv.innerHTML = '<div style="padding: 24px; text-align: center; color: #f59e0b; font-family: sans-serif; background: #09090b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; dir: rtl;">' +
            '<h2 style="font-size: 20px; font-weight: bold; margin-bottom: 12px;">نرم‌افزار مدیریت گیم‌نت BAZINO PRO</h2>' +
            '<p style="color: #d4d4d8; font-size: 14px; max-width: 450px; line-height: 1.6; margin-bottom: 20px;">' +
            'کدهای نرم‌افزار در حال بروزرسانی برای مرورگر شما می‌باشند. لطفاً روی دکمه زیر کلیک کنید.' +
            '</p>' +
            '<button onclick="window.location.reload(true)" style="background: #f59e0b; color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;">' +
            'بارگذاری مجدد نرم‌افزار' +
            '</button>' +
            '</div>';
        }
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
