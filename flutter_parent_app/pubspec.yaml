name: bazino_parent_app
description: "Bazino Parent - اپلیکیشن نظارت والدین بر فعالیت فرزندان در گیم‌نت بازینو"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  provider: ^6.1.1
  intl: ^0.18.1
  google_fonts: ^6.2.1
  http: ^1.1.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
